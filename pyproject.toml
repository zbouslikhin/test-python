[project]
name = "test-python"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import the code from src/ directly: always the working copy, never a stale install
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
    "vulture>=2.14",
]
